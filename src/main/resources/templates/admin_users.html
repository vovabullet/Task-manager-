<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <style>
        body {
            font-family: Nunito Sans, sans-serif;
            background: linear-gradient(135deg, rgba(255, 90, 90, 0.51), rgba(22, 220, 255, 0.51));
            background-size: 1000%;
            animation: gradientAnimation 15s ease infinite;
        }
        @keyframes gradientAnimation {
            0% { background-position: 0 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }
        .table-responsive {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
        }
        .btn {
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-add { background-color: #28a745; color: white; }
        .btn-edit { background-color: #ffc107; color: white; }
        .btn-delete { background-color: #dc3545; color: white; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Управление пользователями</h1>
        <div>
            <span id="user-email" class="me-3"></span>
            <span id="user-role" class="badge bg-danger">Администратор</span>
            <button id="exit">Выйти</button>
        </div>
    </div>

    <button class="btn btn-add mb-3" onclick="addUser()">Добавить пользователя</button>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Роль</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="users-body">
            <!-- Users will be dynamically added here -->
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav>
        <ul class="pagination justify-content-center" id="pagination">
            <!-- Pagination buttons will be dynamically added here -->
        </ul>
    </nav>
</div>

<script>
    let pageSize = 5;
    let currentPage = 0;

    // Функция для загрузки пользователей
    async function loadUsers(page, apiUrl) {
        try {
            const response = await fetch(`${apiUrl}?page=${page}&size=${pageSize}`);
            const data = await response.json();

            // Отображение пользователей
            const usersBody = document.getElementById('users-body');
            usersBody.innerHTML = '';
            data.content.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                <td>${user.id}</td>
                <td>${user.email}</td>
                <td><span class="badge bg-${getRoleColor(user.role)}">${user.role}</span></td>
                <td>
                    <button class="btn btn-edit" onclick="editUser(${user.id})">Редактировать</button>
                    <button class="btn btn-delete" onclick="deleteUser(${user.id})">Удалить</button>
                </td>
            `;
                usersBody.appendChild(row);
            });

            // Отображение пагинации
            renderUserPagination(data.totalPages, apiUrl);
        } catch (error) {
            console.error('Ошибка загрузки пользователей:', error);
        }
    }

    // Функция для получения цвета роли
    function getRoleColor(role) {
        switch (role) {
            case 'ROLE_ADMIN': return 'danger';
            case 'ROLE_USER': return 'primary';
            default: return 'secondary';
        }
    }

    // Функция для отображения пагинации пользователей
    function renderUserPagination(totalPages, apiUrl) {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        for (let i = 0; i < totalPages; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#">${i + 1}</a>`;
            li.addEventListener('click', (e) => {
                e.preventDefault();
                currentPage = i;
                loadUsers(i, apiUrl);
            });
            pagination.appendChild(li);
        }
    }

    // добавление
    function addUser() {
        window.location.href = `/admin/users/add`;
    }

    // изменение
    function editUser(id) {
        window.location.href = `/admin/users/edit?id=${id}`;
    }

    // удаление
    async function deleteUser(id) {
        const userChoice = confirm(`Вы уверены, что хотите удалить пользователя ${id}?`);
        if (userChoice) {
            try {
                const response = await fetch(`http://localhost:8080/users/${id}/delete`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                if (response.ok) {
                    alert("Пользователь успешно удалён!");
                    window.location.href = `/admin/users`;
                } else {
                    console.error(`Ошибка удаления пользователя: ${response.status}`);
                }
            } catch (error) {
                console.error('Ошибка при выполнении запроса:', error);
            }
        }
    }


    // Функция для получения авторизованного пользователя
    async function getUserByAuth() {
        const response = await fetch(`http://localhost:8080/users/me`);
        if (response.ok) {
            return await response.json();
        } else {
            console.error(`Ошибка получения пользователя: ${response.status}`);
            return null;
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const user = await getUserByAuth();
        if (user) {
            userId = user.id; // Сохраняем ID пользователя
            console.log("ID авторизированного пользователя:", userId);

            const email = user.email;

            // отображение email и роли пользователя
            document.getElementById("user-email").textContent = email;
        } else {
            console.error("Ошибка: пользователь не найден или не авторизован.");
        }

        const apiUrl = `http://localhost:8080/users/all`; // URL для получения задач
        loadUsers(0, apiUrl);
    });
</script>
</body>
</html>
